name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Java unit, sample, and Testcontainers integration tests
        run: ./gradlew check --stacktrace
      - name: Verify local Maven publication
        run: ./gradlew publishToMavenLocal
      - name: Run Python MCP/A2A Harness SDK tests
        run: PYTHONPATH=python/src python3 -m unittest discover -s python/tests -v
      - name: Run lifecycle hook tests
        run: python3 -m unittest discover -s .agents/hooks -p 'test_*.py' -v
