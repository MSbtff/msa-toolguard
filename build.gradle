allprojects {
    group = 'io.github.msbtff'
    version = findProperty('releaseVersion') ?: '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    jacoco {
        toolVersion = '0.8.16'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.named('test') {
        description = 'Runs isolated unit tests (JUnit tag: unit).'
        useJUnitPlatform {
            includeTags 'unit'
        }
        failOnNoDiscoveredTests = false
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.register('unitTest') {
        group = 'verification'
        description = 'Alias for test: unit tests only, with JaCoCo report.'
        dependsOn tasks.named('test')
    }

    tasks.register('integrationTest', Test) {
        group = 'verification'
        description = 'Runs Spring context and integration tests (tag: integration).'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'integration'
        }
        failOnNoDiscoveredTests = false
        shouldRunAfter tasks.named('test')
        jacoco {
            enabled = false
        }
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    tasks.named('jacocoTestCoverageVerification') {
        dependsOn tasks.named('test')
        if (project.name == 'toolguard-spring-boot-starter') {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    '**/store/**',
                    '**/*AutoConfiguration*'
                ])
            }))
        }
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = project.name == 'toolguard-core' ? 0.90 : 0.80
                }
                if (project.name == 'toolguard-core') {
                    limit {
                        counter = 'BRANCH'
                        value = 'COVEREDRATIO'
                        minimum = 0.75
                    }
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification'), tasks.named('integrationTest')
    }

    if (project.name.startsWith('toolguard-')) {
        apply plugin: 'maven-publish'
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                }
            }
            repositories {
                maven {
                    name = 'GitHubPackages'
                    url = uri('https://maven.pkg.github.com/MSbtff/msa-toolguard')
                    credentials {
                        username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user') ?: ''
                        password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key') ?: ''
                    }
                }
            }
        }
    }
}
